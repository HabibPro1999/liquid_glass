name: liquid_glass
description: A Flutter package implementing Apple's Liquid Glass effect using ImageFilter.shader.
version: 1.0.0
repository: https://github.com/user/liquid_glass
issue_tracker: https://github.com/user/liquid_glass/issues
topics:
  - ui
  - effects
  - glass
  - shader

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  sensors_plus: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.liquidglass
        pluginClass: LiquidGlassPlugin
  shaders:
    - shaders/liquid_glass.frag
    - shaders/lightweight_glass.frag
